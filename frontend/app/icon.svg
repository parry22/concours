<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Brief: one cylinder of data split in two; the floating slice is the sealed holdout. Same drawing as Logo in components/ui.tsx. -->
  <defs>
    <linearGradient id="bf-fill" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="29.5">
      <stop offset="0" stop-color="#fbb39c" />
      <stop offset="0.3" stop-color="#f472b6" />
      <stop offset="0.62" stop-color="#c084fc" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bf-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.38" />
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.02" />
      <stop offset="1" stop-color="#000" stop-opacity="0.42" />
    </linearGradient>
    <radialGradient id="bf-cap" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#fffaf6" />
      <stop offset="0.45" stop-color="#ffd9c9" />
      <stop offset="1" stop-color="#f9a58b" />
    </radialGradient>
    <radialGradient id="bf-face" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.9" />
      <stop offset="0.55" stop-color="#a855f7" stop-opacity="0.55" />
      <stop offset="1" stop-color="#2a1640" stop-opacity="0.9" />
    </radialGradient>
    <filter id="bf-blur" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="0.9" />
    </filter>
  </defs>
  <!-- Lower body: the public data. A seam marks the thin leaderboard band above the training rows. -->
  <rect x="7" y="14" width="18" height="15.5" rx="9" ry="3.2" fill="url(#bf-fill)" />
  <rect x="7" y="14" width="18" height="15.5" rx="9" ry="3.2" fill="url(#bf-shade)" />
  <path d="M7.35 20.6a8.65 3.05 0 0 0 17.3 0" stroke="#0a0a0b" stroke-opacity="0.38" stroke-width="0.7" fill="none" />
  <path d="M7.35 21.3a8.65 3.05 0 0 0 17.3 0" stroke="#fff" stroke-opacity="0.3" stroke-width="0.45" fill="none" />
  <path d="M7.35 26.3a8.65 3.05 0 0 0 17.3 0" stroke="#0a0a0b" stroke-opacity="0.35" stroke-width="0.7" fill="none" />
  <rect x="10.4" y="18.6" width="1.1" height="9.6" rx="0.55" fill="#fff" opacity="0.2" />
  <!-- Cut face, lit from the gap by the sealed slice above. -->
  <ellipse cx="16" cy="17.2" rx="9" ry="3.2" fill="url(#bf-face)" />
  <ellipse cx="16" cy="17.2" rx="5.6" ry="1.7" fill="#f9a8d4" opacity="0.55" filter="url(#bf-blur)" />
  <ellipse cx="16" cy="17.2" rx="8.75" ry="3" stroke="#fff" stroke-opacity="0.32" stroke-width="0.5" fill="none" />
  <!-- Glow leaking through the gap. -->
  <ellipse cx="16" cy="12.6" rx="7.5" ry="1.4" fill="#fbb39c" opacity="0.5" filter="url(#bf-blur)" />
  <!-- The sealed holdout slice, floating, with the glowing cap. -->
  <rect x="7" y="3" width="18" height="8.4" rx="9" ry="3.2" fill="url(#bf-fill)" />
  <rect x="7" y="3" width="18" height="8.4" rx="9" ry="3.2" fill="url(#bf-shade)" />
  <path d="M7.35 8.2a8.65 3.05 0 0 0 17.3 0" stroke="#0a0a0b" stroke-opacity="0.3" stroke-width="0.6" fill="none" />
  <rect x="10.4" y="6.8" width="1.1" height="3.6" rx="0.55" fill="#fff" opacity="0.28" />
  <ellipse cx="16" cy="6.2" rx="9" ry="3.2" fill="url(#bf-cap)" />
  <ellipse cx="16" cy="6.2" rx="8.75" ry="3" stroke="#fff" stroke-opacity="0.75" stroke-width="0.5" fill="none" />
  <ellipse cx="13.6" cy="5.4" rx="3.6" ry="1.05" fill="#fff" opacity="0.7" />
  <circle cx="21.4" cy="5.1" r="0.55" fill="#fff" opacity="0.9" />
</svg>
