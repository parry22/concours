[project]
name = "concours-cli"
version = "0.3.0"
description = "Concours from the terminal: fraud models, review queues and improvement rounds."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
concours = "concours_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["concours_cli.py"]
