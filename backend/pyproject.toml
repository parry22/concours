[project]
name = "brief-backend"
version = "0.1.0"
description = "Brief: turns a spreadsheet prediction problem into a protected, Apex-ready competition."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlmodel>=0.0.21",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "docker>=7.1",
    "anthropic>=0.40",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "apex-competition-sdk",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv.sources]
apex-competition-sdk = { git = "https://github.com/macrocosm-os/apex-competitions-builder", rev = "49eb05e" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
