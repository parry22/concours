# RELEASE WORKFLOW (generated by Concours from the hello-world template).
# On a `v*` tag: builds the player and referee images for linux/amd64 and linux/arm64, pushes them to GHCR,
# keyless-signs both image indexes with cosign, then writes the pushed digests and image refs back into
# spec.yaml and commits that change. The spec's `signature.cosign_identity` points at this file's path, so
# keep the path stable. Actions are pinned to commit SHAs; each job gets only the permissions it needs.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - { name: player,  dockerfile: player/Dockerfile }
          - { name: referee, dockerfile: referee/Dockerfile }
    outputs:
      player_digest: ${{ steps.out.outputs.player_digest }}
      referee_digest: ${{ steps.out.outputs.referee_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Build and push (amd64 and arm64)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.ref_name }}
      - name: Sign the image index (keyless)
        run: cosign sign --yes "ghcr.io/${{ github.repository }}-${{ matrix.name }}@${{ steps.build.outputs.digest }}"
      - name: Export digest
        id: out
        run: echo "${{ matrix.name }}_digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  pin-spec:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: main }
      - name: Write digests and refs into spec.yaml
        run: |
          REPO=ghcr.io/${{ github.repository }}
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("spec.yaml"); s = p.read_text()
          repo = os.environ["REPO"]
          s = re.sub(r"(^image:\n  ref: ).*", rf"\g<1>{repo}-player", s, flags=re.M)
          s = re.sub(r"(^image:\n  ref: .*\n  digest: ).*", rf"\g<1>{os.environ['PLAYER']}", s, flags=re.M)
          s = re.sub(r"(  image:\n    ref: ).*", rf"\g<1>{repo}-referee", s)
          s = re.sub(r"(  image:\n    ref: .*\n    digest: ).*", rf"\g<1>{os.environ['REFEREE']}", s)
          p.write_text(s)
          PY
          git config user.name "concours-release-bot"
          git config user.email "release@concours.local"
          git add spec.yaml
          git commit -m "Pin image digests for ${{ github.ref_name }}" || echo "nothing to commit"
          git push origin HEAD:main
        env:
          REPO: ghcr.io/${{ github.repository }}
          PLAYER: ${{ needs.images.outputs.player_digest }}
          REFEREE: ${{ needs.images.outputs.referee_digest }}
