# RELEASE WORKFLOW (generated by Brief from the hello-world template).
# On a `v*` tag: builds the player and referee images, pushes them to GHCR, keyless-signs both with
# cosign, then writes the pushed digests and image refs back into spec.yaml and commits that change.
# The spec's `signature.cosign_identity` points at this file's path, so keep the path stable.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: player,  dockerfile: player/Dockerfile }
          - { name: referee, dockerfile: referee/Dockerfile }
    outputs:
      player_digest: ${{ steps.out.outputs.player_digest }}
      referee_digest: ${{ steps.out.outputs.referee_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Build and push
        id: build
        run: |
          IMAGE=ghcr.io/${{ github.repository }}-${{ matrix.name }}
          docker build -f ${{ matrix.dockerfile }} -t "$IMAGE:${{ github.ref_name }}" .
          docker push "$IMAGE:${{ github.ref_name }}"
          FULL=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.ref_name }}")
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "digest=${FULL##*@}" >> "$GITHUB_OUTPUT"
      - name: Sign (keyless)
        run: cosign sign --yes "${{ steps.build.outputs.full }}"
      - name: Export digest
        id: out
        run: echo "${{ matrix.name }}_digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  pin-spec:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Write digests and refs into spec.yaml
        run: |
          REPO=ghcr.io/${{ github.repository }}
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("spec.yaml"); s = p.read_text()
          repo = os.environ["REPO"]
          s = re.sub(r"(^image:\n  ref: ).*", rf"\g<1>{repo}-player", s, flags=re.M)
          s = re.sub(r"(^image:\n  ref: .*\n  digest: ).*", rf"\g<1>{os.environ['PLAYER']}", s, flags=re.M)
          s = re.sub(r"(  image:\n    ref: ).*", rf"\g<1>{repo}-referee", s)
          s = re.sub(r"(  image:\n    ref: .*\n    digest: ).*", rf"\g<1>{os.environ['REFEREE']}", s)
          p.write_text(s)
          PY
          git config user.name "brief-release-bot"
          git config user.email "release@brief.local"
          git add spec.yaml
          git commit -m "Pin image digests for ${{ github.ref_name }}" || echo "nothing to commit"
          git push origin HEAD:main
        env:
          REPO: ghcr.io/${{ github.repository }}
          PLAYER: ${{ needs.images.outputs.player_digest }}
          REFEREE: ${{ needs.images.outputs.referee_digest }}
